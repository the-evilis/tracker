<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Трекер привычек</title>
<meta name="description" content="Трекер привычек: отмечайте выполнение каждый день, следите за сериями и прогрессом. Работает офлайн, синхронизируется между устройствами.">
<meta name="theme-color" content="#2D6A4F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Трекер привычек">
<meta property="og:description" content="Отмечайте привычки каждый день, следите за сериями и прогрессом.">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary">
<!-- PWA: иконка на домашнем экране и запуск без адресной строки -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- preconnect должен идти ДО запроса шрифтов, иначе он бесполезен -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/styles.css">

</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="toast" id="toast"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">Привычки</div>
    <div class="auth-sub">Трекер для тех, кто растёт каждый день</div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('magic')">Magic Link</button>
      <button class="auth-tab" onclick="switchAuthTab('google')">Google</button>
    </div>

    <div id="auth-magic-panel">
      <div id="auth-form-area">
        <input class="auth-input" id="auth-email" type="email" placeholder="Ваш email"
          onkeydown="if(event.key==='Enter')sendMagicLink()">
        <button class="auth-btn" id="magic-btn" onclick="sendMagicLink()">Отправить ссылку для входа</button>
      </div>
      <div id="auth-magic-sent" class="magic-sent" style="display:none">
        <div class="big-emoji">✉️</div>
        <p>Письмо отправлено на<br><span class="email-highlight" id="sent-email-display"></span></p>
        <p style="margin-top:8px;font-size:12px;color:var(--text3)">Кликни на ссылку в письме — и готово</p>
      </div>
      <div class="auth-msg" id="magic-msg"></div>
    </div>

    <div id="auth-google-panel" style="display:none">
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Войти через Google
      </button>
      <div class="auth-msg" id="google-msg"></div>
    </div>

    <div style="margin-top:10px">
      <button class="google-btn" onclick="enterDemo()" style="border-color:var(--accent);color:var(--accent)">
        <span style="font-size:18px">👁</span>
        Демо-режим (без регистрации)
      </button>
      <p style="font-size:11px;color:var(--text3);margin-top:8px">Данные не сохраняются между сессиями</p>
    </div>
  </div>
</div>

<!-- EMOJI PICKER -->
<div class="emoji-picker" id="emoji-picker"></div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Редактировать привычки</h2>
    <div id="habit-editor"></div>
    <div class="add-row">
      <input class="add-input" id="new-habit-input" placeholder="Название новой привычки..."
        maxlength="30" onkeydown="if(event.key==='Enter')addHabit()">
      <button class="btn btn-primary" id="add-habit-btn" onclick="addHabit()">+ Добавить</button>
    </div>
    <div id="archive-block"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveHabits()">Сохранить</button>
    </div>
  </div>
</div>

<!-- DEMO BANNER -->
<div id="demo-banner" class="demo-banner" style="display:none" role="status">
  <span>👁 Демо-режим: история заполнена для примера, изменения не сохранятся</span>
  <button onclick="leaveDemo()">Войти и сохранять</button>
</div>

<!-- MAIN APP -->
<div id="main-app" class="app" style="display:none">
  <div class="header">
    <div class="header-left">
      <h1 id="screen-title">Tracker</h1>
      <div class="date-sub" id="date-sub"></div>
      <div id="sync-status"></div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="edit-btn" onclick="openModal()" title="Редактировать привычки" aria-label="Редактировать привычки"><span style="font-size:20px;line-height:1">⚙️</span></button>
      <button class="icon-btn" id="sound-btn" onclick="toggleSound()" title="Звук" aria-label="Включить или выключить звук">🔔</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Тема" aria-label="Переключить тему">🌙</button>
      <div class="user-avatar" id="user-avatar" onclick="toggleUserMenu(event)">
        <div class="user-menu" id="user-menu">
          <div class="user-email" id="user-email-display"></div>
          <label class="user-menu-item" style="cursor:pointer;display:flex;align-items:center;gap:8px">
            📷 Фото (на этом устройстве)
            <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
          </label>
          <button class="user-menu-item" id="export-btn" onclick="exportData()" style="width:100%;text-align:left;border:none;background:none;cursor:pointer;font-family:var(--sans)">⬇️ Скачать данные</button>
          <label class="user-menu-item" style="cursor:pointer;display:flex;align-items:center;gap:8px">
            ⬆️ Загрузить из файла
            <input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importData(event)">
          </label>
          <button class="user-menu-item" id="signout-btn" style="width:100%;text-align:left;border:none;background:none;cursor:pointer;font-family:var(--sans)">🚪 Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TRACKER: привычки по дням ─────────────────────────────────────── -->
  <section class="tab-panel" id="panel-tracker" role="tabpanel" aria-labelledby="tab-tracker">
    <div class="stats-period" id="stats-period"></div>
    <div class="stats-row" id="stats-row"></div>

    <div class="nav">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" aria-label="Назад">←</button>
      <span class="nav-title" id="nav-title"></span>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)" aria-label="Вперёд">→</button>
      <div class="view-toggle" role="tablist" aria-label="Период">
        <button class="view-btn" id="btn-week" onclick="setView('week')" role="tab">Нед.</button>
        <button class="view-btn" id="btn-month" onclick="setView('month')" role="tab">Мес.</button>
        <button class="view-btn" id="btn-year" onclick="setView('year')" role="tab">Год</button>
      </div>
    </div>

    <div id="week-header" class="week-grid-header" style="display:none"></div>
    <div class="habits-list" id="habits-list"></div>
  </section>

  <!-- ── FOCUS: цели и список из ста пунктов ───────────────────────────── -->
  <section class="tab-panel" id="panel-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
    <div id="hundred-card"></div>
    <div class="goals-grid" id="goals-grid"></div>
    <div class="section-actions">
      <button class="btn btn-primary" id="add-goal-btn" onclick="openGoalModal()">+ Новая цель</button>
    </div>
  </section>

  <!-- Отдельный экран одной цели: задачи внутри направления -->
  <section class="tab-panel" id="panel-goal" role="tabpanel" hidden>
    <button class="back-btn" onclick="closeGoal()">← К целям</button>
    <div id="goal-detail"></div>
  </section>

  <!-- ── MONEY: доходы, расходы и графики ──────────────────────────────── -->
  <section class="tab-panel" id="panel-money" role="tabpanel" aria-labelledby="tab-money" hidden>
    <div class="nav">
      <button class="nav-btn" id="money-prev" onclick="moneyNavigate(-1)" aria-label="Предыдущий месяц">←</button>
      <span class="nav-title" id="money-title"></span>
      <button class="nav-btn" id="money-next" onclick="moneyNavigate(1)" aria-label="Следующий месяц">→</button>
    </div>
    <div class="stats-row" id="money-stats"></div>
    <div class="section-actions">
      <button class="btn btn-expense" onclick="openTxModal('expense')">− Расход</button>
      <button class="btn btn-income" onclick="openTxModal('income')">+ Доход</button>
    </div>
    <div id="money-charts"></div>
    <div id="money-list"></div>
  </section>

  <!-- ── CREDO: принципы ───────────────────────────────────────────────── -->
  <section class="tab-panel" id="panel-credo" role="tabpanel" aria-labelledby="tab-credo" hidden>
    <div id="credo-today"></div>
    <div id="credo-list"></div>
    <div class="section-actions">
      <button class="btn btn-primary" id="add-credo-btn" onclick="openCredoModal()">+ Новый принцип</button>
    </div>
  </section>

  <!-- ── QUOTES: цитаты ────────────────────────────────────────────────── -->
  <section class="tab-panel" id="panel-quotes" role="tabpanel" aria-labelledby="tab-quotes" hidden>
    <div class="quote-card" onclick="nextQuote()">
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-author" id="quote-author"></div>
    </div>
    <div id="quotes-list"></div>
    <div class="section-actions">
      <button class="btn btn-primary" id="add-quote-btn" onclick="openQuoteModal()">+ Своя цитата</button>
    </div>
  </section>

  <div class="signature">@is_laforge</div>
</div>

<!-- ── НИЖНЕЕ МЕНЮ ─────────────────────────────────────────────────────── -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Разделы" style="display:none">
  <button class="tab-btn" id="tab-focus" role="tab" aria-selected="false" aria-controls="panel-focus" onclick="setTab('focus')">
    <span class="tab-ico">🎯</span><span class="tab-lbl">Focus</span>
  </button>
  <button class="tab-btn" id="tab-money" role="tab" aria-selected="false" aria-controls="panel-money" onclick="setTab('money')">
    <span class="tab-ico">💰</span><span class="tab-lbl">Money</span>
  </button>
  <button class="tab-btn active" id="tab-tracker" role="tab" aria-selected="true" aria-controls="panel-tracker" onclick="setTab('tracker')">
    <span class="tab-ico">✅</span><span class="tab-lbl">Tracker</span>
  </button>
  <button class="tab-btn" id="tab-credo" role="tab" aria-selected="false" aria-controls="panel-credo" onclick="setTab('credo')">
    <span class="tab-ico">🧭</span><span class="tab-lbl">Credo</span>
  </button>
  <button class="tab-btn" id="tab-quotes" role="tab" aria-selected="false" aria-controls="panel-quotes" onclick="setTab('quotes')">
    <span class="tab-ico">💬</span><span class="tab-lbl">Quotes</span>
  </button>
</nav>

<!-- ── МОДАЛКА ЦЕЛИ ────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="goal-modal">
  <div class="modal">
    <h2 id="goal-modal-title">Новая цель</h2>
    <div class="field-row">
      <button class="edit-icon-btn" id="goal-icon-btn" onclick="openGoalEmoji(this)" title="Значок" aria-label="Выбрать значок">🎯</button>
      <input class="add-input" id="goal-name" placeholder="Название цели" maxlength="40">
    </div>
    <div class="color-row" id="goal-colors"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeGoalModal()">Отмена</button>
      <button class="btn btn-primary" id="goal-save-btn" onclick="saveGoalModal()">Сохранить</button>
    </div>
  </div>
</div>

<!-- ── МОДАЛКА ОПЕРАЦИИ ────────────────────────────────────────────────── -->
<div class="modal-overlay" id="tx-modal">
  <div class="modal">
    <h2 id="tx-modal-title">Расход</h2>
    <input class="add-input amount-input" id="tx-amount" type="text" inputmode="decimal"
           placeholder="0" autocomplete="off">
    <div class="cat-row" id="tx-categories"></div>
    <div class="field-row">
      <input class="add-input" id="tx-date" type="date">
    </div>
    <div class="field-row">
      <input class="add-input" id="tx-note" placeholder="Заметка (необязательно)" maxlength="80">
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="tx-delete-btn" onclick="deleteTxFromModal()" style="display:none">Удалить</button>
      <button class="btn btn-secondary" onclick="closeTxModal()">Отмена</button>
      <button class="btn btn-primary" id="tx-save-btn" onclick="saveTxModal()">Сохранить</button>
    </div>
  </div>
</div>

<!-- ── УНИВЕРСАЛЬНАЯ МОДАЛКА ВВОДА (кредо, цитаты, пункты списка) ───────── -->
<div class="modal-overlay" id="text-modal">
  <div class="modal">
    <h2 id="text-modal-title">Добавить</h2>
    <textarea class="add-input text-area" id="text-modal-input" rows="3" maxlength="280"></textarea>
    <input class="add-input" id="text-modal-extra" placeholder="Автор" maxlength="60" style="display:none">
    <div class="modal-footer">
      <button class="btn btn-danger" id="text-modal-delete" onclick="deleteFromTextModal()" style="display:none">Удалить</button>
      <button class="btn btn-secondary" onclick="closeTextModal()">Отмена</button>
      <button class="btn btn-primary" id="text-modal-save" onclick="saveTextModal()">Сохранить</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>

</body>
</html>
