# Трекер привычек (the-evilis/tracker) — статичный PWA из /opt/tracker/public.
# Данные и авторизация — во внешнем Supabase, на сервере никакой БД нет.
server {
    server_name tracker.fountaine.online;

    root /opt/tracker/public;
    index index.html;

    access_log /var/log/nginx/tracker.access.log;
    error_log  /var/log/nginx/tracker.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # CSP. В приложении есть inline-скрипты и стили, поэтому нужен
    # 'unsafe-inline'; список источников закрывает всё, кроме реально
    # используемых: клиент Supabase с jsDelivr и шрифты Google.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # index.html не кэшируем: иначе после деплоя у людей висит старая версия.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Service worker обязан быть свежим: старый sw.js продолжит отдавать
    # людям устаревшую версию приложения даже после деплоя.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Область действия — весь сайт, а не только каталог файла.
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Иконки меняются редко — их можно держать в кэше долго.
    location ~* ^/icon-.*\.png$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Скрипт и стили обновляются вместе с разметкой, поэтому не кэшируются:
    # иначе после деплоя человек получал бы новую страницу со старым кодом.
    # try_files ... =404 вместо фолбэка на index.html: пропавший файл должен
    # быть виден как ошибка, а не молча подменяться страницей — именно так
    # однажды сайт «работал», отдавая HTML вместо скрипта.
    location ~ ^/(app\.js|styles\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Приложение — одна страница; любой путь отдаём как index.html,
    # чтобы не терять OAuth-редиректы Supabase с хвостом в URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .git и прочие точечные файлы наружу не отдаём.
    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tracker.fountaine.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tracker.fountaine.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = tracker.fountaine.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tracker.fountaine.online;
    return 404; # managed by Certbot


}
