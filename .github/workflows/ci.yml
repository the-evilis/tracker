# Прогон тестов на каждый пуш и пул-реквест в main.
# Логика (даты, серии, миграция ключей) проверяется без браузера,
# smoke — в настоящем Chromium на статике из репозитория.
name: Тесты

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Синтаксис скрипта из index.html
        run: node tests/check-syntax.js index.html

      - name: Тесты логики
        run: npm test

      - name: Установка браузера
        run: npx playwright install --with-deps chromium

      - name: Smoke-тесты в браузере
        run: npx playwright test

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
